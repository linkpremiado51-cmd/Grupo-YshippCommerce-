<article
  class="card-noticia"
  data-id=""
  data-categoria=""
  data-timestamp=""
>

  <header class="card-noticia__cabecalho">
    <span
      class="card-noticia__categoria"
      data-categoria
    ></span>

    <h2 class="card-noticia__titulo">
      <a
        href=""
        class="card-noticia__link"
        data-link-artigo
      ></a>
    </h2>
  </header>

  <p
    class="card-noticia__resumo"
    data-resumo
  ></p>

  <section
    class="card-noticia__video"
    data-video
  ></section>

  <ul
    class="card-noticia__ficha"
    data-ficha
  ></ul>

  <section
    class="card-noticia__relacionados"
    data-relacionados
  ></section>

  <footer class="card-noticia__rodape">
    <a
      href=""
      class="card-noticia__ver-completo"
      data-link-artigo
    >
      Ver artigo completo
    </a>
  </footer>

</article>
