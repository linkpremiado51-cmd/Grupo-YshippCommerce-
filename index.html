<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniGeekNews</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}

header {
  background: #121212;
  color: white;
  padding: 12px;
  text-align: center;
}

nav {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: #222;
}

nav button {
  flex: 1;
  padding: 10px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

nav button.ativo {
  background: #ff0055;
}

main {
  padding: 10px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

/* card */
.card {
  background: white;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.card h3 {
  font-size: 16px;
  margin: 0 0 6px;
}

.card p {
  font-size: 13px;
  color: #555;
}
</style>
</head>

<body>

<header>
  <h2>AniGeekNews</h2>
</header>

<nav>
  <button class="aba ativo" data-categoria="analises">Análises</button>
  <button class="aba" data-categoria="futebol">Futebol</button>
  <button class="aba" data-categoria="acesso">Acesso</button>
</nav>

<main>
  <div id="cards" class="cards"></div>
</main>

<script>
/* ===== ESTADO GLOBAL ===== */
const estado = {
  categoriaAtiva: 'analises'
};

/* ===== NOTÍCIAS FAKE (SIMULANDO FIREBASE) ===== */
const noticiasFake = [
  {
    titulo: 'Nova IA revoluciona o mercado',
    resumo: 'Tecnologia promete mudar tudo.',
    categoria: 'analises'
  },
  {
    titulo: 'Time vence clássico',
    resumo: 'Jogo histórico termina em virada.',
    categoria: 'futebol'
  },
  {
    titulo: 'Site libera acesso antecipado',
    resumo: 'Usuários já podem testar.',
    categoria: 'acesso'
  }
];

/* ===== RENDERIZA CARDS ===== */
function renderizar() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  noticiasFake
    .filter(n => n.categoria === estado.categoriaAtiva)
    .forEach(n => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${n.titulo}</h3>
        <p>${n.resumo}</p>
      `;
      container.appendChild(card);
    });
}

/* ===== TROCA DE ABA ===== */
document.querySelectorAll('.aba').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.aba')
      .forEach(b => b.classList.remove('ativo'));

    btn.classList.add('ativo');
    estado.categoriaAtiva = btn.dataset.categoria;
    renderizar();
  };
});

/* ===== INICIAL ===== */
renderizar();
</script>

</body>
</html>
